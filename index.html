<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FS Dog | Cardápio Digital</title>
  <meta name="description" content="Cardápio digital FS Dog - faça seu pedido pelo WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--red:#e8000d;--red2:#ff2630;--yellow:#ffd600;--dark:#090909;--surface:#151515;--surface2:#202020;--border:#2b2b2b;--text:#f5f5f5;--muted:#929292;--green:#22c55e;--radius:18px}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{background:var(--dark);color:var(--text);font-family:Outfit,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}.hero{position:relative;overflow:hidden;background:#0b0b0b}.hero:before{content:"";position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=1200&q=70&fit=crop') center/cover;opacity:.16;filter:blur(1px)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),#090909)}.hero-content{position:relative;z-index:1;text-align:center;padding:38px 16px 0}.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(74px,22vw,126px);letter-spacing:7px;line-height:.9;background:linear-gradient(160deg,#fff 0%,var(--yellow) 42%,var(--red) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{font-size:12px;text-transform:uppercase;letter-spacing:5px;color:var(--muted);font-weight:800;margin-top:8px}.status-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:20px auto 0}.status-badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:800}.status-badge.open{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.38);color:#4ade80}.status-badge.closed{background:rgba(232,0,13,.12);border:1px solid rgba(232,0,13,.38);color:#ff7b7b}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.hours{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:680px}.chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:11px;font-weight:700}.chip b{display:block;color:var(--text);font-size:12px}.stripe{position:relative;z-index:1;height:5px;margin-top:30px;background:repeating-linear-gradient(90deg,var(--red) 0,var(--red) 28px,var(--yellow) 28px,var(--yellow) 56px)}.cat-nav{position:sticky;top:0;z-index:10;background:rgba(9,9,9,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);overflow:auto;scrollbar-width:none}.cat-nav::-webkit-scrollbar{display:none}.cat-inner{display:flex;gap:7px;padding:12px 16px;min-width:max-content}.cat-btn{background:transparent;border:1.5px solid var(--border);color:var(--muted);border-radius:999px;padding:8px 14px;font:800 13px Outfit;cursor:pointer}.cat-btn.active,.cat-btn:hover{background:var(--red);border-color:var(--red);color:#fff}.section{max-width:760px;margin:auto;padding:28px 16px}.sec-title{display:flex;align-items:center;gap:10px;font-family:'Bebas Neue';font-size:32px;letter-spacing:2px;color:var(--yellow)}.sec-title:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,rgba(232,0,13,.8),transparent)}.sec-sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}.grid{display:flex;flex-direction:column;gap:14px;margin-top:18px}.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative}.card.in-cart{border-color:var(--red)}.img-wrap{height:178px;position:relative;overflow:hidden}.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface2);transition:.35s}.card:hover img{transform:scale(1.04)}.badge{position:absolute;right:10px;top:10px;background:var(--red);color:#fff;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}.body{padding:15px 16px 16px}.name{font-size:17px;font-weight:900;line-height:1.2}.desc{font-size:13px;color:var(--muted);font-weight:600;line-height:1.45;margin-top:6px}.foot{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:14px}.price{font-family:'Bebas Neue';font-size:28px;color:var(--yellow);letter-spacing:1px}.price small{display:block;font-family:Outfit;font-size:11px;color:var(--muted);font-weight:700}.add,.qty{border:none;border-radius:999px;font-weight:900}.add{background:var(--red);color:#fff;padding:10px 18px;font-family:Outfit;cursor:pointer}.add:hover{background:var(--red2)}.qty{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);padding:5px 10px}.qty button,.ci button{border:none;background:transparent;color:var(--text);font-size:20px;font-weight:900;width:28px;height:28px;cursor:pointer}.qty span,.ci span{font-family:'Bebas Neue';font-size:21px;color:var(--yellow);min-width:20px;text-align:center}.fab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:255px;height:58px;border:0;border-radius:999px;background:var(--red);color:#fff;padding:8px 18px 8px 9px;box-shadow:0 10px 34px rgba(232,0,13,.52);font-weight:900;cursor:pointer}.fab.hidden{display:none}.fab-icon{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center;position:relative}.count{position:absolute;right:-4px;top:-5px;background:var(--yellow);color:#000;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px}.fab-total{font-family:'Bebas Neue';font-size:22px;color:var(--yellow);letter-spacing:1px}.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{background:#111;width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;border-top:3px solid var(--red)}.handle{width:38px;height:4px;background:#333;border-radius:999px;margin:12px auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}.sheet-title{font-family:'Bebas Neue';font-size:28px;color:var(--yellow);letter-spacing:2px}.close{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:0;color:#fff;font-weight:900}.sheet-body{padding:16px 20px 34px}.cart-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.cart-item img{width:54px;height:54px;border-radius:13px;object-fit:cover}.cart-info{flex:1;min-width:0}.cart-name{font-weight:900;font-size:14px}.cart-unit{color:var(--muted);font-size:11px;font-weight:700;margin-top:2px}.ci{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 7px}.sub{font-family:'Bebas Neue';font-size:20px;min-width:67px;text-align:right}.field{margin-top:18px}.label{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:13px;color:var(--text);padding:13px 14px;font:700 14px Outfit;outline:none}.input:focus{border-color:var(--red)}textarea.input{height:70px;resize:none}.toggle,.pay{display:flex;gap:8px;flex-wrap:wrap}.toggle button,.pay button{background:var(--surface2);border:2px solid var(--border);color:var(--muted);border-radius:12px;padding:11px 12px;font:800 13px Outfit;cursor:pointer;flex:1}.pay button{flex:0 0 auto}.toggle button.active{border-color:var(--red);color:#fff;background:rgba(232,0,13,.12)}.pay button.active{border-color:var(--yellow);background:var(--yellow);color:#000}.totals{margin-top:20px;padding-top:15px;border-top:1px solid var(--border)}.row{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0}.row.grand{color:#fff;align-items:center;border-top:1px solid #333;padding-top:12px;margin-top:12px}.row.grand b{font-family:'Bebas Neue';font-size:31px;color:var(--yellow);letter-spacing:1px}.wa{margin-top:18px;width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;padding:17px;font:900 15px Outfit;cursor:pointer}.empty{text-align:center;color:var(--muted);font-weight:900;padding:46px 12px}.spacer{height:92px}footer{text-align:center;border-top:1px solid #171717;padding:20px;color:#444;font-size:11px;font-weight:900;letter-spacing:1px}@media(min-width:720px){.card{display:grid;grid-template-columns:230px 1fr}.img-wrap{height:100%}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <div class="logo">FS DOG</div>
      <div class="subtitle">Hot Dog Artesanal • Pedidos Online</div>
      <div class="status-wrap">
        <div class="status-badge" id="statusBadge"><span class="dot"></span><span id="statusText">Verificando...</span></div>
        <div class="hours" id="hoursGrid"></div>
      </div>
    </div>
    <div class="stripe"></div>
  </header>
  <nav class="cat-nav"><div class="cat-inner" id="catNav"></div></nav>
  <main id="menu"></main>
  <div class="spacer"></div>
  <footer>© FS Dog • Cardápio digital</footer>
  <button class="fab hidden" id="fab" onclick="openCart()"><span style="display:flex;align-items:center;gap:10px"><span class="fab-icon">🛒<span class="count" id="count">0</span></span>Ver pedido</span><span class="fab-total" id="fabTotal">R$ 0,00</span></button>
  <div class="overlay" id="overlay" onclick="outsideClose(event)"><div class="sheet"><div class="handle"></div><div class="sheet-head"><div class="sheet-title">🛒 Seu Pedido</div><button class="close" onclick="closeCart()">✕</button></div><div class="sheet-body" id="sheetBody"></div></div></div>
  <script>
    const CFG={whatsapp:'5548999999999',loja:'FS Dog',taxaEntrega:5,horarios:{0:['18:00','02:00'],1:null,2:['18:00','02:00'],3:['18:00','02:00'],4:['18:00','02:00'],5:['18:00','04:30'],6:['18:00','04:30']}};
    const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const CATS=[{id:'dogs',label:'🌭 Hot Dogs',sub:'Tradicionais, prensados e especiais'},{id:'burgers',label:'🍔 Hambúrgueres',sub:'Artesanais e bem recheados'},{id:'combos',label:'🔥 Combos',sub:'Mais completo e melhor custo-benefício'},{id:'bebidas',label:'🥤 Bebidas',sub:'Para acompanhar seu pedido'},{id:'sobremesas',label:'🍫 Sobremesas',sub:'Doces e novidades'}];
    const img={dog:'https://images.unsplash.com/photo-1612392062631-94440de1a580?w=700&q=80&fit=crop',dog2:'https://images.unsplash.com/photo-1619740455993-9d622522ca51?w=700&q=80&fit=crop',burger:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=700&q=80&fit=crop',batata:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=700&q=80&fit=crop',bebida:'https://images.unsplash.com/photo-1622597467836-f3285f2131b8?w=700&q=80&fit=crop',doce:'https://images.unsplash.com/photo-1564355808539-22fda35bed7e?w=700&q=80&fit=crop'};
    const MENU={dogs:[{id:1,name:'Dog Tradicional',desc:'Pão, salsicha, maionese, ketchup, mostarda, milho, ervilha, vinagrete e batata palha.',price:14.9,img:img.dog},{id:2,name:'Dog Prensado',desc:'Hot dog prensado no capricho, crocante por fora e bem recheado por dentro.',price:18.9,img:img.dog2,badge:'Mais pedido'},{id:3,name:'Dog Especial',desc:'Salsicha, cheddar, bacon, maionese da casa, vinagrete e batata palha.',price:22.9,img:img.dog,badge:'Especial'},{id:4,name:'Dog Bacon Cheddar',desc:'Dog reforçado com cheddar cremoso e bacon crocante.',price:24.9,img:img.dog2}],burgers:[{id:5,name:'X Burger',desc:'Hambúrguer, queijo, salada, milho, batata palha e maionese da casa.',price:22.9,img:img.burger},{id:6,name:'X Bacon',desc:'Hambúrguer, queijo, bacon crocante, salada e molho especial.',price:27.9,img:img.burger,badge:'Top'},{id:7,name:'Artesanal FS',desc:'Burger artesanal, queijo, bacon, cebola caramelizada e molho especial FS Dog.',price:32.9,img:img.burger,badge:'Artesanal'}],combos:[{id:8,name:'Combo Individual',desc:'1 Dog Prensado + 1 refrigerante lata.',price:26.9,img:img.dog2},{id:9,name:'Combo Casal',desc:'2 Dogs especiais + 2 bebidas.',price:54.9,img:img.dog,badge:'Casal'},{id:10,name:'Combo Família',desc:'4 lanches + 4 bebidas. Ideal para dividir.',price:99.9,img:img.burger,badge:'Família'}],bebidas:[{id:11,name:'Refrigerante Lata',desc:'Coca-Cola, Guaraná ou Sprite 350ml.',price:6,img:img.bebida},{id:12,name:'Água Mineral',desc:'Com ou sem gás 500ml.',price:4,img:img.bebida},{id:13,name:'Suco Natural',desc:'Sabores conforme disponibilidade.',price:9,img:img.bebida}],sobremesas:[{id:14,name:'Hot Dog de Chocolate',desc:'Produto doce especial da casa. Consulte disponibilidade.',price:18,img:img.doce,badge:'Novidade'},{id:15,name:'Brownie',desc:'Brownie de chocolate para finalizar o pedido.',price:12,img:img.doce}]};
    let cart={},delivery='entrega',payment='';
    const fmt=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
    function min(h){const[a,b]=h.split(':').map(Number);return a*60+b}
    function checkStatus(){const now=new Date(),d=now.getDay(),hm=now.getHours()*60+now.getMinutes(),h=CFG.horarios[d],badge=document.getElementById('statusBadge'),text=document.getElementById('statusText');let open=false,msg='Fechado hoje 😴';if(h){let o=min(h[0]),c=min(h[1]);if(c<=o)c+=1440;let t=hm;if(hm<o&&c>1440)t+=1440;open=t>=o&&t<c;msg=open?'Aberto agora • fecha às '+h[1]:(hm<o?'Fechado • abre às '+h[0]:'Fechado por hoje 😴')}badge.className='status-badge '+(open?'open':'closed');text.textContent=msg;renderHours()}
    function renderHours(){const grid=document.getElementById('hoursGrid');let html='';for(let i=0;i<7;i++){let h=CFG.horarios[i];html+=`<div class="chip">${DIAS[i]}<b>${h?h[0]+' às '+h[1]:'Fechado'}</b></div>`}grid.innerHTML=html}
    function render(){const nav=document.getElementById('catNav'),main=document.getElementById('menu');CATS.forEach((c,i)=>{nav.innerHTML+=`<button class="cat-btn ${i?'':'active'}" onclick="go('${c.id}')" data-cat="${c.id}">${c.label}</button>`;main.innerHTML+=`<section class="section" id="${c.id}"><div class="sec-title">${c.label}</div><div class="sec-sub">${c.sub}</div><div class="grid" id="grid-${c.id}"></div></section>`;setTimeout(()=>{document.getElementById('grid-'+c.id).innerHTML=MENU[c.id].map(item=>card(item)).join('')})});const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`[data-cat="${e.target.id}"]`)?.classList.add('active')}}),{threshold:.25});setTimeout(()=>CATS.forEach(c=>obs.observe(document.getElementById(c.id))),100)}
    function card(it){return`<article class="card" id="card-${it.id}"><div class="img-wrap"><img src="${it.img}" alt="${it.name}" loading="lazy">${it.badge?`<span class="badge">${it.badge}</span>`:''}</div><div class="body"><div class="name">${it.name}</div><div class="desc">${it.desc}</div><div class="foot"><div class="price"><small>a partir de</small>${fmt(it.price)}</div><div id="act-${it.id}"><button class="add" onclick="add(${it.id})">+ Adicionar</button></div></div></div></article>`}
    function go(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}
    function all(){return Object.values(MENU).flat()}function find(id){return all().find(x=>x.id==id)}
    function add(id){cart[id]=(cart[id]||0)+1;sync(id);fab()}function rem(id){if(!cart[id])return;cart[id]--;if(cart[id]<=0)delete cart[id];sync(id);fab()}function sync(id){const a=document.getElementById('act-'+id),c=document.getElementById('card-'+id),q=cart[id]||0;if(!a)return;if(q){a.innerHTML=`<div class="qty"><button onclick="rem(${id})">−</button><span>${q}</span><button onclick="add(${id})">+</button></div>`;c.classList.add('in-cart')}else{a.innerHTML=`<button class="add" onclick="add(${id})">+ Adicionar</button>`;c.classList.remove('in-cart')}}
    function total(){return Object.entries(cart).reduce((s,[id,q])=>s+find(id).price*q,0)}function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}function fab(){document.getElementById('count').textContent=count();document.getElementById('fabTotal').textContent=fmt(total());document.getElementById('fab').classList.toggle('hidden',!count())}
    function openCart(){sheet();document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden'}function closeCart(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow=''}function outsideClose(e){if(e.target.id==='overlay')closeCart()}
    function sheet(){const b=document.getElementById('sheetBody');if(!count()){b.innerHTML='<div class="empty">🌭<br>Nada no pedido ainda.</div>';return}let items=Object.entries(cart).map(([id,q])=>{const it=find(id);return`<div class="cart-item"><img src="${it.img}"><div class="cart-info"><div class="cart-name">${it.name}</div><div class="cart-unit">${fmt(it.price)} cada</div></div><div class="ci"><button onclick="cartQty(${id},-1)">−</button><span>${q}</span><button onclick="cartQty(${id},1)">+</button></div><div class="sub">${fmt(it.price*q)}</div></div>`}).join('');let fee=delivery==='entrega'?CFG.taxaEntrega:0;b.innerHTML=`${items}<div class="field"><div class="label">👤 Seu nome</div><input id="name" class="input" placeholder="Como devemos te chamar?"></div><div class="field"><div class="label">🛵 Tipo de pedido</div><div class="toggle"><button class="${delivery==='entrega'?'active':''}" onclick="setDelivery('entrega')">Entrega</button><button class="${delivery==='retirada'?'active':''}" onclick="setDelivery('retirada')">Retirada</button></div><div style="display:${delivery==='entrega'?'block':'none'};margin-top:10px"><input id="addr" class="input" placeholder="Rua, número, bairro e complemento"></div></div><div class="field"><div class="label">💳 Pagamento</div><div class="pay">${['dinheiro','pix','credito','debito'].map(p=>`<button class="${payment===p?'active':''}" onclick="setPay('${p}')">${p==='credito'?'crédito':p}</button>`).join('')}</div></div><div class="field"><div class="label">📝 Observações</div><textarea id="notes" class="input" placeholder="Ex: sem cebola, sem ketchup..."></textarea></div><div class="totals"><div class="row"><span>Subtotal</span><span>${fmt(total())}</span></div><div class="row"><span>${delivery==='entrega'?'Entrega':'Retirada'}</span><span>${delivery==='entrega'?fmt(fee):'Grátis'}</span></div><div class="row grand"><span>Total</span><b>${fmt(total()+fee)}</b></div></div><button class="wa" onclick="sendWA()">Fazer pedido pelo WhatsApp</button>`}
    function cartQty(id,d){d>0?add(id):rem(id);sheet();fab()}function setDelivery(x){delivery=x;sheet()}function setPay(x){payment=x;sheet()}
    function sendWA(){const name=document.getElementById('name')?.value.trim(),addr=document.getElementById('addr')?.value.trim(),notes=document.getElementById('notes')?.value.trim();if(!name)return alert('Informe seu nome.');if(delivery==='entrega'&&!addr)return alert('Informe o endereço.');if(!payment)return alert('Escolha o pagamento.');let lines=Object.entries(cart).map(([id,q])=>{const it=find(id);return`• ${q}x ${it.name} — ${fmt(it.price*q)}`}).join('\n');let fee=delivery==='entrega'?CFG.taxaEntrega:0;let labels={dinheiro:'Dinheiro',pix:'Pix',credito:'Cartão de crédito',debito:'Cartão de débito'};let msg=`🌭 *NOVO PEDIDO — ${CFG.loja.toUpperCase()}*\n\n👤 *Cliente:* ${name}\n🛵 *Tipo:* ${delivery==='entrega'?'Entrega':'Retirada'}\n${delivery==='entrega'?'📍 *Endereço:* '+addr+'\n':''}\n📋 *Itens:*\n${lines}\n\n${notes?'📝 *Obs:* '+notes+'\n\n':''}🧾 Subtotal: ${fmt(total())}\n${delivery==='entrega'?'🛵 Entrega: '+fmt(fee)+'\n':''}💰 *Total: ${fmt(total()+fee)}*\n💳 *Pagamento:* ${labels[payment]}`;window.open(`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank')}
    checkStatus();setInterval(checkStatus,60000);render();
  </script>
</body>
</html>
